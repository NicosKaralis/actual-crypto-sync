# The dev budget from `npm run dev:seed`, logged in with a session token.
# dev/config.password.yml is the same with the server password.
# The wallets are public exchange wallets, the same as in the tests.

actual:
  server_url: http://localhost:5006
  sync_id: ${ACTUAL_BUDGET_SYNC_ID}
  auth:
    session: ${ACTUAL_SESSION_TOKEN}

