name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Keeps the release PR up to date with the commits on main. Merging it creates the tag
      # and the GitHub release.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The milestone of a version, for example v1.0.0, holds the issues planned for it.
  milestone:
    name: Close the milestone
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    steps:
      - name: Close the milestone of the released version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          # $ENV.TAG is read by jq, not by the shell.
          # shellcheck disable=SC2016
          milestone=$(gh api "repos/$GH_REPO/milestones?state=open&per_page=100" \
            --jq '.[] | select(.title == $ENV.TAG) | "\(.number) \(.open_issues)"')
          if [ -z "$milestone" ]; then
            echo "No open milestone $TAG."
            exit 0
          fi
          read -r number open <<< "$milestone"
          if [ "$open" -gt 0 ]; then
            echo "::warning::Milestone $TAG has $open open issues. Move them to another milestone."
          fi
          gh api -X PATCH "repos/$GH_REPO/milestones/$number" -f state=closed --silent
          echo "Closed milestone $TAG."

  # A tag pushed with GITHUB_TOKEN doesn't start other workflows, so the image is built from here.
  image:
    name: Image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
