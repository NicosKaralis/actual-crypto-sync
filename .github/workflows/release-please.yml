name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Creates the tag and the GitHub release once the release PR is merged. It uses
      # GITHUB_TOKEN, so the tag starts no workflow and the image job below builds the image once.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  # Its own job, so that a failure here never stops the image, the milestone or the merge back.
  release-pr:
    name: Release PR
    needs: release-please
    runs-on: ubuntu-26.04
    # Holds the Release Please app's key; only main and v* tags can use it.
    environment: release
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # Keeps the release PR up to date with the commits on main. With the app's token, the
      # release PR runs CI like any other PR.
      - id: pr
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
      # A release of nothing but Renovate's Actual updates merges by itself once its checks pass,
      # so each new Actual version becomes a patch release. Any other release waits for the
      # maintainer.
      - name: Auto-merge an Actual-only release
        if: steps.pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          # The PR as JSON, read with jq: GitHub evaluates a step's env even when its if is
          # false, and fromJSON fails on an empty output.
          PR_JSON: ${{ steps.pr.outputs.pr }}
          SHA: ${{ github.sha }}
        run: |
          pr=$(jq -r .number <<< "$PR_JSON")
          last=$(gh release view --json tagName --jq .tagName)
          # The subjects of the commits since the last release, without the merge commits.
          # More commits than the compare API returns can't be an Actual-only release.
          others=$(gh api "repos/$GH_REPO/compare/$last...$SHA" --jq '
            if .total_commits > (.commits | length) then "too many commits"
            else .commits[] | select(.parents | length == 1) | .commit.message | split("\n")[0]
            end' | grep -Eiv '^fix\(deps\): update actual( |$)' || true)
          if [ -n "$others" ]; then
            echo "The release has more than Actual updates, so the maintainer merges it:"
            echo "$others"
            # Auto-merge may be on from an earlier, Actual-only state of the release PR.
            gh pr merge "$pr" --disable-auto 2>/dev/null || true
            exit 0
          fi
          gh pr merge "$pr" --auto --merge
          echo "Release PR #$pr merges when its checks pass."

  # The milestone of a version, for example v1.0.0, holds the issues planned for it.
  milestone:
    name: Close the milestone
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    steps:
      - name: Close the milestone of the released version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          # $ENV.TAG is read by jq, not by the shell.
          # shellcheck disable=SC2016
          milestone=$(gh api "repos/$GH_REPO/milestones?state=open&per_page=100" \
            --jq '.[] | select(.title == $ENV.TAG) | "\(.number) \(.open_issues)"')
          if [ -z "$milestone" ]; then
            echo "No open milestone $TAG."
            exit 0
          fi
          read -r number open <<< "$milestone"
          if [ "$open" -gt 0 ]; then
            echo "::warning::Milestone $TAG has $open open issues. Move them to another milestone."
          fi
          gh api -X PATCH "repos/$GH_REPO/milestones/$number" -f state=closed --silent
          echo "Closed milestone $TAG."

  # The release brings the work to main, which closes its issues, so they're released now.
  # Open issues keep the label: their work is only on develop. Its own job, so that a failure
  # here never stops the milestone.
  labels:
    name: Remove the awaiting release label
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    steps:
      - name: Remove the label from the closed issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          numbers=$(gh issue list --state closed --label 'awaiting release' --limit 200 \
            --json number --jq '.[].number')
          for n in $numbers; do
            gh api -X DELETE "repos/$GH_REPO/issues/$n/labels/awaiting%20release" --silent
            echo "#$n: released"
          done

  # Brings the release commit, and any hotfix or release branch, into develop. It pushes with
  # a deploy key, because deploy keys are the only bypass of the develop ruleset that a
  # workflow can use. On a conflict it fails, and the maintainer merges main into develop.
  merge-back:
    name: Merge main back into develop
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          ssh-key: ${{ secrets.MERGE_BACK_SSH_KEY }}
      - name: Merge main into develop
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge --no-ff --no-edit -m "chore: merge $TAG back into develop" origin/main; then
            echo "::error::main doesn't merge into develop without conflicts. Merge it by hand."
            exit 1
          fi
          git push origin develop

  # A tag pushed with GITHUB_TOKEN doesn't start other workflows, so the image is built from here.
  image:
    name: Image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # The most that any job in the called workflow asks for: a called job can't get more than
    # this. contents: write is for its notes job, which edits the release notes.
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    # The called workflow's dockerhub job reads DOCKERHUB_TOKEN from the release environment.
    # A called workflow gets no secrets unless they're passed, even with environment: set.
    secrets: inherit
