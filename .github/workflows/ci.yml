name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npx tsc

  # Git flow: main only takes develop, a release or hotfix branch, Release Please's PR, or
  # Renovate's Actual update (renovate/main-*; Renovate updates nothing else on main).
  # GitHub opens pull requests against main, the default branch, so this catches the rest.
  base:
    name: Base branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - name: Check the PR's base branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$BASE" != main ]; then
            exit 0
          fi
          if [ "$SAME_REPO" = true ]; then
            case "$HEAD" in
              develop | release/* | hotfix/* | release-please--* | renovate/main-*) exit 0 ;;
            esac
          fi
          echo "::error::Pull requests go into develop. Change the base branch of this pull request to develop."
          exit 1

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check the PR's commits
        run: >-
          npx commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
      - name: Check the PR title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Run the test stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max

  # A real Actual server and a mock of the explorers and price provider, in the throwaway
  # stack of test/e2e/compose.yml. The same command runs it locally.
  e2e:
    name: End-to-end tests
    needs: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm run test:e2e

  image:
    name: Image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each architecture builds on its own runner, never under QEMU.
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: actual-crypto-sync:ci
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - name: Print the usage
        run: docker run --rm actual-crypto-sync:ci --help
      - name: Load better-sqlite3 as the non-root user
        run: >-
          docker run --rm --entrypoint node actual-crypto-sync:ci -e
          "const D = require('better-sqlite3');
          const v = new D(':memory:').prepare('select sqlite_version() as v').get().v;
          const user = require('node:os').userInfo().username;
          if (user === 'root') throw new Error('runs as root');
          console.log(process.arch, user, v);"
