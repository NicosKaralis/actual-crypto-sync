name: Release

# Runs on a tag pushed by hand, from release-please.yml when it creates a release, or by hand
# for an existing tag when that run failed.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The release tag, such as v1.0.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, such as v1.0.0
        required: true
        type: string

permissions:
  contents: read

env:
  # The build jobs push here by digest; the manifest job builds the index here, and the
  # dockerhub job copies it to Docker Hub.
  IMAGE: ghcr.io/nicoskaralis/actual-crypto-sync
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # Each architecture builds on its own runner, never under QEMU.
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # The commit of the checked-out tag, not the one the workflow runs on (they differ on a
          # run by hand), for the revision label.
          context: git
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}},value=${{ env.TAG }}
      - id: build
        name: Build and push by digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
      - name: Save the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The multi-arch index, built once on GHCR from the per-arch digests.
  manifest:
    name: Multi-arch manifest
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tags: ${{ steps.push.outputs.tags }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      # For the tag's commit: revision and sha-<commit> come from it, as in the build jobs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # The annotations go on the multi-arch index, the manifest that a tag points to.
          # GHCR reads org.opencontainers.image.source there to link the package to the repo.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          context: git
          images: ${{ env.IMAGE }}
          # <version>, <major>.<minor>, <major>, sha-<commit> and latest (latest only for stable versions).
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
            type=sha
      - id: push
        name: Create and push the manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t annotations < <(jq -r '.annotations[] | "--annotation=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${annotations[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$DOCKER_METADATA_OUTPUT_VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          # The tags without the image name, such as 1.1.0 and latest.
          echo "tags=$(jq -r '[.tags[] | split(":") | last] | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")" >> "$GITHUB_OUTPUT"
      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:$DOCKER_METADATA_OUTPUT_VERSION"

  # Docker Hub gets a copy of the GHCR index, so both registries have the same digest. A failure
  # here doesn't touch GHCR.
  dockerhub:
    name: Copy to Docker Hub
    needs: manifest
    runs-on: ubuntu-26.04
    # Holds the Docker Hub credentials; only main and v* tags can use it.
    environment: release
    permissions:
      contents: read
      packages: read
    env:
      TARGET: docker.io/nicoskaralis/actual-crypto-sync
      DIGEST: ${{ needs.manifest.outputs.digest }}
      TAGS: ${{ needs.manifest.outputs.tags }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy the index
        run: |
          args=()
          for tag in $TAGS; do args+=("--tag=$TARGET:$tag"); done
          # One source and no annotations: the index is copied as it is, with the same digest.
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
      - name: Check the digest
        run: |
          for tag in $TAGS; do
            copied=$(docker buildx imagetools inspect "$TARGET:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$copied" != "$DIGEST" ]; then
              echo "::error::$TARGET:$tag is $copied, not $DIGEST as on GHCR."
              exit 1
            fi
          done
          echo "Docker Hub has $DIGEST, as GHCR."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
      # Docker Hub's CSS shows each image as a block, so the README's badges would stack one per
      # line. The overview gets one line of text links in their place.
      - name: Write the Docker Hub overview
        env:
          REPO: https://github.com/${{ github.repository }}
        run: |
          if ! grep -q '^<!-- badges' README.md || ! grep -q '^<!-- /badges -->' README.md; then
            echo "::error::README.md has no <!-- badges --> and <!-- /badges --> lines."
            exit 1
          fi
          links="[GitHub]($REPO) · [Releases]($REPO/releases) · [Changelog]($REPO/blob/main/CHANGELOG.md) · [Docs]($REPO/tree/main/docs) · [Image on GHCR]($REPO/pkgs/container/actual-crypto-sync)"
          awk -v links="$links" '
            /^<!-- badges/ { print links; skip = 1; next }
            /^<!-- \/badges -->/ { skip = 0; next }
            !skip
          ' README.md > "$RUNNER_TEMP/dockerhub-overview.md"
      - name: Sync the Docker Hub overview
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          readme-filepath: ${{ runner.temp }}/dockerhub-overview.md
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: nicoskaralis/actual-crypto-sync
          short-description: ${{ github.event.repository.description }}
          enable-url-completion: true
