name: Live checks

# The built-in tokens, explorers and price providers against the real services
# (test/live/). Not a required check: a service that is down for a while must
# not block other work. A failed weekly run means a contract, an API or a price
# id changed.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - src/tokens.yml
      - src/http.ts
      - src/chains/**
      - src/prices/**
      - test/live/**
      - .github/workflows/live.yml

permissions:
  contents: read

jobs:
  live:
    name: Live checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:live
