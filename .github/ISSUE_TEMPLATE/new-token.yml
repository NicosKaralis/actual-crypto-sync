name: New built-in token
description: Ask for a token to be built in, so a config can use it by its symbol.
labels: [new token, needs triage]
body:
  - type: markdown
    attributes:
      value: |
        You do not need a built-in token to use a token. A config can define any token in its `tokens:` list.
  - type: input
    id: chain
    attributes:
      label: Chain
      placeholder: tron
    validations:
      required: true
  - type: input
    id: symbol
    attributes:
      label: Symbol
      placeholder: USDD
    validations:
      required: true
  - type: input
    id: contract
    attributes:
      label: Contract
      description: The address of the token contract.
    validations:
      required: true
  - type: input
    id: explorer-link
    attributes:
      label: Block explorer link
      description: A link to the token contract on a block explorer, for example Tronscan.
    validations:
      required: true
  - type: textarea
    id: price-ids
    attributes:
      label: Price ids
      description: The id of the token at each price provider, for example its CoinGecko id. Give a link to each page.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Other information
