name: Bug report
description: Something does not work as the docs say.
labels: [bug, needs triage]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste API keys, passwords, session tokens or full wallet addresses.** This repository is public, and the text of an issue stays in its history. A short address, for example `TC9F...R2MJ`, is sufficient.

        For a security issue, do not use this form. Use [private vulnerability reporting](https://github.com/NicosKaralis/actual-crypto-sync/security/advisories/new).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect? What happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag or the Git commit that you run.
      placeholder: ghcr.io/nicoskaralis/actual-crypto-sync:1.0.0
    validations:
      required: true
  - type: input
    id: actual-version
    attributes:
      label: Actual server version
      placeholder: 26.11.0
    validations:
      required: true
  - type: dropdown
    id: scheduler
    attributes:
      label: How do you run it
      options:
        - Kubernetes CronJob
        - docker compose (for example with ofelia)
        - cron
        - By hand
        - Other (tell us in the description)
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config
      description: Your config file. Remove all secrets and wallet addresses first.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The log of one run with `--debug`. Remove all secrets and wallet addresses first.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed all API keys, passwords, session tokens and full wallet addresses from this issue.
          required: true
