# yaml-language-server: $schema=https://raw.githubusercontent.com/NicosKaralis/actual-crypto-sync/main/config.schema.json
# actual-crypto-sync config. Every key is shown; the commented ones are optional.
#
# Secrets never go in this file: write ${NAME} and the value is read from the
# environment variable NAME when the program starts. ${NAME} works in any string
# value; an unset variable is an error naming it, and its value is never logged.
#
# Set through the environment, not this file:
#   CONFIG_FILE        this file's path (default /config/config.yml; --config overrides it)
#   ACTUAL_DATA_DIR    where the budget's local copy is kept (default /cache); created
#                      when missing, and must be writable
#   TZ                 the time zone that decides what "today" is, e.g. Europe/Lisbon
#                      (default UTC in the image)
#
# Telemetry (OpenTelemetry over OTLP/HTTP), also through the environment. Nothing is
# sent unless an endpoint is set:
#   OTEL_EXPORTER_OTLP_ENDPOINT          base URL for both signals; /v1/traces and
#                                        /v1/metrics are added, e.g. http://otel-collector:4318
#   OTEL_EXPORTER_OTLP_TRACES_ENDPOINT   full URL for traces only, overriding the base
#   OTEL_EXPORTER_OTLP_METRICS_ENDPOINT  full URL for metrics only, overriding the base
#   OTEL_EXPORTER_OTLP_TIMEOUT           export timeout in milliseconds (default 5000)

actual:
  server_url: http://actual:5006               # the Actual server, as the program reaches it
  sync_id: ${ACTUAL_BUDGET_SYNC_ID}            # Settings > Advanced > Sync ID in Actual
  auth:                                        # exactly one of the three, always as ${VAR}; see docs/authentication.md
    session: ${ACTUAL_SESSION_TOKEN}           # a token from a login (password or OpenID)
    # password: ${ACTUAL_PASSWORD}             # the server password, single-user servers
    # api_key: ${ACTUAL_API_KEY}               # servers newer than 26.11.0
  # encryption_password: ${ACTUAL_ENCRYPTION_PASSWORD}  # budget encryption, not login; only for end-to-end encrypted budgets

prices:
  currency: eur                                # ISO 4217 code, any case; at least one provider must support it
  providers:                                   # required; tried in order, each a name, or a name with its settings
    - coingecko
    # - coingecko:
    #     demo_api_key: ${COINGECKO_API_KEY}   # a free Demo key raises the rate limit
    #     # pro_api_key: ${COINGECKO_API_KEY}  # or a paid Pro key (uses the Pro API); not both
    #     api_url: https://api.coingecko.com/api/v3  # the default
    #     label: coingecko-main                # the name in logs, spans and metric labels (default: the id)
    #     serial: true                         # one request at a time, 6 s apart, if it rate-limits you
    - coinpaprika                              # asked for the prices that CoinGecko didn't give

chains:                                        # optional, settings per chain
  tron:
    explorers: trongrid                        # one name works too; this is the default
    # explorers:                               # or a list, tried in order until one answers
    #   - trongrid:
    #       api_url: https://api.trongrid.io   # the default
    #       api_key: ${TRONGRID_API_KEY}       # raises TronGrid's rate limit
    #       serial: true                       # or one request at a time, 1 s apart
  bitcoin:
    explorers:
      # - mempool-space:                       # your own mempool instance first...
      #     api_url: http://mempool.lan/api    # any mempool or Esplora API
      #     label: home-mempool                # tells the two entries apart in logs and metrics
      - mempool-space                          # ...then the public one (https://mempool.space/api)
      # - mempool-space:
      #     serial: true                       # one request at a time, 1 s apart

tokens:                                        # optional, tokens that aren't built in (docs/supported.md lists those)
  - chain: tron                                # a chain with tokens (not bitcoin)
    symbol: WTRX                               # what accounts use as token:; can't reuse a built-in name
    contract: TNUC9Qb1rRpS5CbWLmNMxXBjyFoydXjWFR  # the token's contract address
    decimals: 6                                # the contract's decimals
    # display_decimals: 8                      # decimals shown in notes (default: decimals, at most 8)
    price_ids:                                 # at least one; the token's id at each price provider
      coingecko: wrapped-tron

accounts:                                      # the off-budget Actual accounts to keep in line
  - name: "TC9F...R2MJ: TRX"                   # the Actual account, by name or id; each appears once
    chain: tron                                # tron or bitcoin
    token: TRX                                 # a built-in token or one from tokens:
    wallets:                                   # one wallet per account for now: a list,
      - ${TRON_WALLET_ADDRESS}                 # an inline list or a single address (below)

  - name: "WTRX Account"                       # any name you like, as long as it matches the account in Actual
    chain: tron
    token: WTRX                                # defined in tokens: above; a built-in one (USDT) needs only its name
    wallets: ["${TRON_WALLET_ADDRESS}"]        # an inline list; quote ${...} inside [ ], or YAML reads it as a map
                                               # same address as above, fetched once

  - name: Bitcoin
    chain: bitcoin
    token: BTC
    wallets: ${BTC_ADDRESS}                    # a single address
